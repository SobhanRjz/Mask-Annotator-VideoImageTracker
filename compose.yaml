services:
  backend:
    build: ./backend
    container_name: sewer-annotator-backend
    environment:
      SAM2_MODEL_ID: "facebook/sam2.1-hiera-small"
      DATA_ROOT: "/data"
      HF_HOME: "/models/huggingface"
      FRONTEND_ORIGIN: "http://localhost:8092"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      UV_SYSTEM_PYTHON: "1"
      UV_PYTHON_DOWNLOADS: "0"
    develop:
      watch:
        - action: sync
          path: ./backend/app
          target: /app/app
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/uv.lock
    volumes:
      - annotator-data:/data
      - sam2-models:/models
    ports: ["8091:8090"]
    gpus: all
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
  frontend:
    build: ./frontend
    container_name: sewer-annotator-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports: ["8092:80"]
    restart: unless-stopped
volumes:
  annotator-data:
  sam2-models:
