server { listen 80; server_name _; client_max_body_size 20G; root /usr/share/nginx/html; index index.html; location /api/ { resolver 127.0.0.11 valid=10s ipv6=off; set $backend http://backend:8090; proxy_pass $backend; proxy_http_version 1.1; proxy_connect_timeout 5s; proxy_read_timeout 3600s; proxy_send_timeout 3600s; } location / { try_files $uri /index.html; } }
